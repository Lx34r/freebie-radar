  <circle class="ink" cx="20" cy="20" r="4" fill="none" stroke-opacity=".45" stroke-width="1.4"/>
  <path class="acc" d="M20 20 L20 5 A15 15 0 0 1 30.6 9.4 Z" fill-opacity=".4"/>
  <line class="accs" x1="20" y1="20" x2="20" y2="5" stroke-width="2.2" stroke-linecap="round"/>
  <circle class="acc" cx="26" cy="13" r="2.4"/>
  <circle class="inkf" cx="13" cy="25" r="1.8" fill-opacity=".55"/>
